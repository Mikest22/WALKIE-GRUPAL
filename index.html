<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>Walkie Pro</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div id="floatingSpeaker" class="floating hidden"></div>
  <div id="joinToast" class="join-toast hidden"></div>

  <main class="card">
    <h1>📻 Walkie Pro</h1>

    <section id="loginBox" class="login-box">
      <div class="panel login-panel">
        <input id="nameInput" placeholder="Tu nombre" autocomplete="name">
        <input id="roomInput" placeholder="Sala" value="radio-mike">
        <button id="joinBtn" type="button">ENTRAR</button>
      </div>
    </section>

    <section id="radioBox" class="radio-box hidden">
      <div class="panel info-grid">
        <div class="info-item">
          <div class="icon-box">🏢</div>
          <div>
            <div class="label">Sala:</div>
            <div class="value" id="roomLabel"></div>
          </div>
        </div>
        <div class="info-item">
          <div class="icon-box">👤</div>
          <div>
            <div class="label">Usuario:</div>
            <div class="value" id="nameLabel"></div>
          </div>
        </div>
      </div>

      <div class="panel full-item">
        <div class="icon-box">📱</div>
        <div class="wide">
          <div class="label">ID dispositivo:</div>
          <div class="id-value" id="deviceIdLabel"></div>
        </div>
      </div>

      <div class="panel full-item">
        <div class="icon-box">📡</div>
        <div class="wide">
          <div class="label yellow">ID Radio:</div>
          <div class="value" id="myIdLabel"></div>
        </div>
      </div>

      <div class="wave" aria-hidden="true"></div>

      <div id="talkBtn" role="button" tabindex="0" aria-label="Mantén presionado para hablar">
        <span id="talkMain">HABLAR</span>
        <span id="talkSub">Esperando transmisión</span>
      </div>

      <div class="panel status-panel">
        <div id="status">🟢 CONECTADO</div>
      </div>

      <button class="panel user-row" id="openUsersPanel" type="button">
        <span class="info-item">
          <span class="icon-box">👥</span>
          <span>
            <span class="users-title">Usuarios conectados</span>
            <span id="usersCountText">0 conectados</span>
            <span id="usersBox"></span>
          </span>
        </span>
        <span class="arrow">›</span>
      </button>
    </section>
  </main>

  <section id="usersScreen" class="users-screen hidden" aria-label="Usuarios conectados">
    <div class="users-header">
      <h2>👥 Usuarios</h2>
      <button id="closeUsersScreen" type="button">VOLVER</button>
    </div>
    <div id="usersListScreen"></div>
  </section>

  <audio id="startSound" src="./motorola-start.mp3" preload="auto"></audio>
  <audio id="endSound" src="./motorola-end.mp3" preload="auto"></audio>
  <audio id="joinSound" src="./motorola-start.mp3" preload="auto"></audio>

  <script type="module" src="./app.js"></script>
</body>
</html>
