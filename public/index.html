<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Walkie Grupal</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  background:#061527;
  color:white;
  font-family:Arial,sans-serif;
}

body{
  display:flex;
  justify-content:center;
  align-items:center;
  padding:15px;
}

.card{
  width:100%;
  max-width:430px;
  background:#183b64;
  border-radius:26px;
  padding:20px;
  text-align:center;
}

h1{
  font-size:34px;
  margin:10px 0 20px;
}

input,button{
  width:100%;
  padding:16px;
  margin:8px 0;
  border:none;
  border-radius:16px;
  font-size:18px;
}

button{
  color:white;
  font-weight:bold;
  background:#2ecc71;
}

#talkBtn{
  width:250px;
  height:250px;
  border-radius:50%;
  background:#ef3340;
  font-size:42px;
  box-shadow:0 12px 0 #8d1520;
  margin:25px auto;
  display:block;
}

#talkBtn:active{
  transform:translateY(8px);
  box-shadow:0 3px 0 #8d1520;
}

#status{
  color:#ffd166;
  font-size:24px;
  margin:15px 0;
}

.user{
  background:#0d2746;
  padding:10px;
  border-radius:12px;
  margin:8px 0;
}

.small{
  color:#dfe6e9;
  font-size:15px;
}
</style>
</head>

<body>

<div class="card">
  <h1>📻 Walkie Grupal</h1>

  <div id="loginBox">
    <input id="nameInput" placeholder="Tu nombre">
    <input id="roomInput" value="radio-mike" placeholder="Nombre de sala">
    <button onclick="joinRoom()">ENTRAR A LA SALA</button>
    <p class="small">Funciona con WiFi y datos móviles si Render está en HTTPS.</p>
  </div>

  <div id="radioBox" style="display:none;">
    <p><b>Sala:</b> <span id="roomLabel"></span></p>
    <p><b>Tu ID:</b> <span id="myIdLabel">...</span></p>

    <button id="talkBtn">HABLAR</button>

    <div id="status">Conectando...</div>

    <h3>Usuarios conectados</h3>
    <div id="usersBox"></div>

    <p class="small">Mantén presionado HABLAR y suelta para dejar de transmitir.</p>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script>

<script>
let socket;
let peer;
let localStream;
let room = "";
let myName = "";
let myPeerId = "";
let calls = {};
let users = {};

const loginBox = document.getElementById("loginBox");
const radioBox = document.getElementById("radioBox");
const nameInput = document.getElementById("nameInput");
const roomInput = document.getElementById("roomInput");
const roomLabel = document.getElementById("roomLabel");
const myIdLabel = document.getElementById("myIdLabel");
const statusBox = document.getElementById("status");
const usersBox = document.getElementById("usersBox");
const talkBtn = document.getElementById("talkBtn");

function setStatus(text){
  statusBox.innerText = text;
}

function getFixedPeerId(){
  let id = localStorage.getItem("walkie_grupal_peer_id");

  if(!id){
    id = "radio-" + Math.random().toString(36).substring(2, 10);
    localStorage.setItem("walkie_grupal_peer_id", id);
  }

  return id;
}

async function prepareMic(){
  localStream = await navigator.mediaDevices.getUserMedia({
    audio:{
      echoCancellation:true,
      noiseSuppression:true,
      autoGainControl:true
    },
    video:false
  });

  localStream.getAudioTracks().forEach(track=>{
    track.enabled = false;
  });
}

function createAudio(peerId, stream){
  let audio = document.getElementById("audio-" + peerId);

  if(!audio){
    audio = document.createElement("audio");
    audio.id = "audio-" + peerId;
    audio.autoplay = true;
    audio.playsInline = true;
    document.body.appendChild(audio);
  }

  audio.srcObject = stream;
  audio.volume = 1;
  audio.muted = false;

  audio.play().catch(()=>{
    setStatus("Toca HABLAR una vez para activar audio.");
  });
}

function addUser(peerId, name){
  if(peerId === myPeerId) return;

  users[peerId] = name;
  renderUsers();
}

function removeUser(peerId){
  delete users[peerId];

  if(calls[peerId]){
    calls[peerId].close();
    delete calls[peerId];
  }

  const audio = document.getElementById("audio-" + peerId);
  if(audio) audio.remove();

  renderUsers();
}

function renderUsers(){
  usersBox.innerHTML = "";

  const ids = Object.keys(users);

  if(ids.length === 0){
    usersBox.innerHTML = "<p class='small'>No hay otros usuarios todavía.</p>";
    return;
  }

  ids.forEach(id=>{
    const div = document.createElement("div");
    div.className = "user";
    div.innerText = users[id];
    usersBox.appendChild(div);
  });
}

function callUser(peerId){
  if(calls[peerId]) return;

  const call = peer.call(peerId, localStream);

  call.on("stream", remoteStream=>{
    createAudio(peerId, remoteStream);
    setStatus("Conectado. Esperando transmisión.");
  });

  call.on("close", ()=>{
    removeUser(peerId);
  });

  calls[peerId] = call;
}

async function joinRoom(){
  myName = nameInput.value.trim();
  room = roomInput.value.trim();

  if(!myName || !room){
    alert("Escribe tu nombre y la sala.");
    return;
  }

  try{
    await prepareMic();
  }catch{
    alert("Debes permitir el micrófono.");
    return;
  }

  loginBox.style.display = "none";
  radioBox.style.display = "block";

  roomLabel.innerText = room;

  socket = io();

  myPeerId = getFixedPeerId();

  peer = new Peer(myPeerId, {
    host: location.hostname,
    port: location.port || (location.protocol === "https:" ? 443 : 80),
    path: "/peerjs",
    secure: location.protocol === "https:",
    config:{
      iceServers:[
        { urls:"stun:stun.l.google.com:19302" },
        { urls:"stun:stun1.l.google.com:19302" },
        { urls:"stun:stun2.l.google.com:19302" }
      ]
    }
  });

  peer.on("open", id=>{
    myPeerId = id;
    myIdLabel.innerText = id;

    socket.emit("join-room", {
      room,
      peerId:id,
      name:myName
    });

    setStatus("Conectado. Esperando transmisión.");
  });

  peer.on("call", call=>{
    call.answer(localStream);

    call.on("stream", remoteStream=>{
      createAudio(call.peer, remoteStream);
      setStatus("Conectado. Esperando transmisión.");
    });

    calls[call.peer] = call;
  });

  peer.on("error", error=>{
    if(error.type === "unavailable-id"){
      localStorage.removeItem("walkie_grupal_peer_id");
      alert("Tu ID estaba repetido. Recarga la página.");
    }else{
      setStatus("Error: " + error.type);
    }
  });

  socket.on("users-in-room", existingUsers=>{
    existingUsers.forEach(user=>{
      addUser(user.peerId, user.name);
      callUser(user.peerId);
    });
  });

  socket.on("user-joined", user=>{
    addUser(user.peerId, user.name);
  });

  socket.on("user-left", peerId=>{
    removeUser(peerId);
  });
}

function startTalking(){
  if(!localStream){
    setStatus("Micrófono no listo.");
    return;
  }

  localStream.getAudioTracks().forEach(track=>{
    track.enabled = true;
  });

  setStatus("Transmitiendo para todos...");
}

function stopTalking(){
  if(!localStream) return;

  localStream.getAudioTracks().forEach(track=>{
    track.enabled = false;
  });

  setStatus("Conectado. Esperando transmisión.");
}

talkBtn.addEventListener("touchstart", e=>{
  e.preventDefault();
  startTalking();
});

talkBtn.addEventListener("touchend", e=>{
  e.preventDefault();
  stopTalking();
});

talkBtn.addEventListener("touchcancel", e=>{
  e.preventDefault();
  stopTalking();
});

talkBtn.addEventListener("mousedown", e=>{
  e.preventDefault();
  startTalking();
});

talkBtn.addEventListener("mouseup", e=>{
  e.preventDefault();
  stopTalking();
});

talkBtn.addEventListener("mouseleave", e=>{
  e.preventDefault();
  stopTalking();
});
</script>

</body>
</html>
