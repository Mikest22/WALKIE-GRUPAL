<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Walkie Pro</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
  -webkit-user-select:none;
}

html,body{
  width:100%;
  height:100dvh;
  overflow:hidden;
  font-family:Arial,sans-serif;
  background:#020812;
  color:white;
}

body{
  display:flex;
  justify-content:center;
  align-items:center;
  background:
    radial-gradient(circle at top,#063a55 0%,transparent 35%),
    radial-gradient(circle at bottom,#001f1e 0%,#020812 75%);
}

.card{
  width:100vw;
  height:100dvh;
  max-width:430px;
  padding:calc(8px + env(safe-area-inset-top)) 18px calc(8px + env(safe-area-inset-bottom));
  overflow:hidden;
  display:flex;
  flex-direction:column;
  justify-content:space-evenly;
  background:
    radial-gradient(circle at 50% 45%,rgba(0,190,255,.11),transparent 32%),
    linear-gradient(180deg,rgba(2,25,38,.98),rgba(0,15,22,.98));
}

h1{
  text-align:center;
  font-size:46px;
  line-height:1;
  font-family:Impact,Arial Black,sans-serif;
  color:#ffe0ad;
  text-shadow:
    0 0 16px rgba(255,185,90,.9),
    4px 4px 0 rgba(18,9,35,.95);
}

.panel{
  border:1px solid rgba(0,220,255,.48);
  border-radius:18px;
  background:rgba(0,25,35,.72);
  box-shadow:
    inset 0 0 20px rgba(0,210,255,.08),
    0 0 12px rgba(0,200,255,.08);
  padding:12px;
  margin:5px 0;
}

.infoGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.infoItem,
.fullItem{
  display:flex;
  align-items:center;
  gap:13px;
  text-align:left;
}

.iconBox{
  min-width:54px;
  width:54px;
  height:54px;
  border-radius:16px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
  background:rgba(0,180,255,.12);
  border:1px solid rgba(0,220,255,.22);
  box-shadow:inset 0 0 18px rgba(0,220,255,.08);
}

.iconBlue{color:#39dfff;}
.iconPurple{color:#7d73ff;}
.iconYellow{color:#ffc247;}

.label{
  color:#42dcff;
  font-weight:bold;
  font-size:15px;
  margin-bottom:5px;
}

.value{
  color:#fff;
  font-weight:bold;
  font-size:21px;
}

.idValue{
  color:#e6fbff;
  font-size:16px;
  word-break:break-word;
  background:rgba(255,255,255,.09);
  border:1px solid rgba(0,220,255,.22);
  border-radius:12px;
  padding:8px 10px;
  margin-top:5px;
}

input,button{
  width:100%;
  border:none;
  border-radius:14px;
  padding:14px;
  font-size:18px;
  margin-top:8px;
}

input{
  background:rgba(255,255,255,.12);
  color:white;
  text-align:center;
  border:1px solid rgba(0,220,255,.3);
  user-select:text;
  -webkit-user-select:text;
}

button{
  background:#2ecc71;
  color:white;
  font-weight:bold;
}

.wave{
  height:40px;
  margin:0;
  opacity:.85;
  background:
    repeating-linear-gradient(
      90deg,
      transparent 0 14px,
      rgba(0,255,220,.8) 14px 18px,
      transparent 18px 28px
    );
  filter:drop-shadow(0 0 8px rgba(0,255,220,.35));
}

#talkBtn{
  width:180px;
  height:180px;
  margin:4px auto;
  border-radius:50%;
  border:4px solid #ff9a37;
  color:white;
  background:
    radial-gradient(circle at center,#172431 0%,#081018 58%,#02060a 100%);
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  box-shadow:
    0 0 20px rgba(255,140,40,.95),
    0 0 48px rgba(255,115,20,.45),
    inset 0 0 35px rgba(255,255,255,.07);
  touch-action:none;
  position:relative;
  -webkit-touch-callout:none;
}

#talkBtn::before{
  content:"";
  position:absolute;
  inset:-18px;
  border-radius:50%;
  border:1px solid rgba(0,220,255,.12);
  box-shadow:0 0 35px rgba(0,200,255,.08);
}

.transmitting{
  border:4px solid #00ff88 !important;
  box-shadow:
    0 0 20px #00ff88,
    0 0 45px rgba(0,255,136,.75),
    inset 0 0 25px rgba(0,255,136,.3) !important;
}

.transmitting #talkMain{
  color:#00ff88 !important;
  text-shadow:0 0 14px rgba(0,255,136,.95);
}

#talkMain{
  font-size:32px;
  font-weight:bold;
  color:white;
  pointer-events:none;
}

#talkSub{
  font-size:14px;
  margin-top:7px;
  color:#ffd18a;
  pointer-events:none;
}

.statusPanel{
  border-color:rgba(0,255,100,.55);
}

#status{
  font-size:34px;
  color:#00ff66 !important;
  font-weight:bold;
  text-shadow:
    0 0 10px rgba(0,255,102,.85),
    0 0 22px rgba(0,255,102,.45);
}

.userRow{
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.user{
  background:rgba(255,255,255,.08);
  border:1px solid rgba(0,220,255,.22);
  border-radius:12px;
  padding:8px;
  margin-top:6px;
  color:white;
  text-align:left;
}

#usersBox{
  max-height:80px;
  overflow:hidden;
}

#floatingSpeaker{
  position:fixed;
  top:18px;
  left:50%;
  transform:translateX(-50%);
  background:rgba(0,0,0,.88);
  color:#00ff88;
  padding:12px 22px;
  border-radius:999px;
  font-weight:bold;
  z-index:9999;
  display:none;
  box-shadow:0 0 24px rgba(0,255,136,.75);
}

#radioBox{
  display:flex;
  flex-direction:column;
  justify-content:space-evenly;
  height:100%;
}

@media(max-height:760px){
  h1{font-size:40px;}
  .panel{padding:9px;margin:4px 0;}
  .iconBox{width:46px;height:46px;min-width:46px;font-size:24px;}
  .label{font-size:14px;}
  .value{font-size:18px;}
  .idValue{font-size:14px;padding:7px;}
  .wave{height:28px;}
  #talkBtn{width:150px;height:150px;}
  #talkMain{font-size:28px;}
  #talkSub{font-size:12px;}
  #status{font-size:28px;}
}
</style>
</head>

<body>

<div id="floatingSpeaker"></div>

<div class="card">

  <h1>📻 Walkie Pro</h1>

  <div id="loginBox">
    <div class="panel">
      <input id="nameInput" placeholder="Tu nombre">
      <input id="roomInput" placeholder="Sala" value="radio-mike">
      <button onclick="joinRoom()">ENTRAR</button>
    </div>
  </div>

  <div id="radioBox" style="display:none;">

    <div class="panel infoGrid">
      <div class="infoItem">
        <div class="iconBox iconBlue">🏢</div>
        <div>
          <div class="label">Sala:</div>
          <div class="value" id="roomLabel"></div>
        </div>
      </div>

      <div class="infoItem">
        <div class="iconBox iconBlue">👤</div>
        <div>
          <div class="label">Usuario:</div>
          <div class="value" id="nameLabel"></div>
        </div>
      </div>
    </div>

    <div class="panel fullItem">
      <div class="iconBox iconPurple">📱</div>
      <div style="width:100%;">
        <div class="label">ID dispositivo:</div>
        <div class="idValue" id="deviceIdLabel"></div>
      </div>
    </div>

    <div class="panel fullItem">
      <div class="iconBox iconYellow">📡</div>
      <div>
        <div class="label" style="color:#ffc247;">ID Radio:</div>
        <div class="value" id="myIdLabel"></div>
      </div>
    </div>

    <div class="wave"></div>

    <div id="talkBtn">
      <span id="talkMain">HABLAR</span>
      <span id="talkSub">Esperando transmisión</span>
    </div>

    <div class="panel statusPanel">
      <div id="status">🟢 CONECTADO</div>
    </div>

    <div class="panel userRow">
      <div class="infoItem">
        <div class="iconBox iconBlue">👥</div>
        <div>
          <h3>Usuarios conectados</h3>
          <div id="usersBox"></div>
        </div>
      </div>
      <div style="font-size:34px;">›</div>
    </div>

  </div>

</div>

<script src="/socket.io/socket.io.js"></script>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script>

<script>
const motorolaStart = new Audio("./assets/motorola-start.mp3");
const motorolaEnd = new Audio("./assets/motorola-end.mp3");

motorolaStart.preload = "auto";
motorolaEnd.preload = "auto";
motorolaStart.volume = 1;
motorolaEnd.volume = 1;

let audioUnlocked = false;

let socket;
let peer;
let localStream;
let room = "";
let myName = "";
let myPeerId = "";
let myDeviceId = "";
let users = {};
let calls = {};
let isTalking = false;

const talkBtn = document.getElementById("talkBtn");
const talkMain = document.getElementById("talkMain");
const talkSub = document.getElementById("talkSub");

talkBtn.addEventListener("selectstart", e => e.preventDefault());
talkBtn.addEventListener("contextmenu", e => e.preventDefault());

function unlockSounds(){
  if(audioUnlocked) return;

  audioUnlocked = true;

  try{
    motorolaStart.load();
    motorolaEnd.load();

    motorolaStart.muted = true;
    motorolaEnd.muted = true;

    motorolaStart.play().then(()=>{
      motorolaStart.pause();
      motorolaStart.currentTime = 0;
      motorolaStart.muted = false;
    }).catch(()=>{ motorolaStart.muted = false; });

    motorolaEnd.play().then(()=>{
      motorolaEnd.pause();
      motorolaEnd.currentTime = 0;
      motorolaEnd.muted = false;
    }).catch(()=>{ motorolaEnd.muted = false; });

  }catch{
    motorolaStart.muted = false;
    motorolaEnd.muted = false;
  }
}

function instantBeep(type){
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();

  osc.type = "square";
  osc.frequency.value = type === "start" ? 1200 : 650;

  gain.gain.setValueAtTime(0.16, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.05);

  osc.connect(gain);
  gain.connect(ctx.destination);

  osc.start();
  osc.stop(ctx.currentTime + 0.05);
}

function playSound(type){
  const sound = type === "start" ? motorolaStart : motorolaEnd;

  try{
    sound.pause();
    sound.currentTime = 0;
    sound.volume = 1;
    sound.play().catch(()=>{
      instantBeep(type);
    });
  }catch{
    instantBeep(type);
  }
}

function getDeviceId(){
  let id = localStorage.getItem("walkie_device");

  if(!id){
    id = "device-" + crypto.randomUUID();
    localStorage.setItem("walkie_device", id);
  }

  return id;
}

function getPeerId(){
  let id = localStorage.getItem("walkie_radio");

  if(!id){
    id = "radio-" + crypto.randomUUID().replace(/-/g,"").substring(0,14);
    localStorage.setItem("walkie_radio", id);
  }

  return id;
}

function showSpeaker(name){
  const box = document.getElementById("floatingSpeaker");
  box.innerText = "🎙️ " + name + " está hablando";
  box.style.display = "block";
}

function hideSpeaker(){
  document.getElementById("floatingSpeaker").style.display = "none";
}

async function joinRoom(){
  myName = document.getElementById("nameInput").value.trim();
  room = document.getElementById("roomInput").value.trim();

  if(!myName || !room){
    alert("Completa los datos");
    return;
  }

  unlockSounds();

  localStorage.setItem("walkie_name", myName);
  localStorage.setItem("walkie_room", room);

  myDeviceId = getDeviceId();
  myPeerId = getPeerId();

  localStream = await navigator.mediaDevices.getUserMedia({
    audio:true,
    video:false
  });

  localStream.getAudioTracks().forEach(t=>t.enabled=false);

  document.getElementById("loginBox").style.display = "none";
  document.getElementById("radioBox").style.display = "flex";

  document.getElementById("roomLabel").innerText = room;
  document.getElementById("nameLabel").innerText = myName;
  document.getElementById("deviceIdLabel").innerText = myDeviceId;
  document.getElementById("myIdLabel").innerText = myPeerId;

  socket = io();

  peer = new Peer(myPeerId,{
    host:location.hostname,
    port:location.port || (location.protocol === "https:" ? 443 : 80),
    path:"/peerjs",
    secure:location.protocol === "https:",
    config:{
      iceServers:[
        {urls:"stun:stun.l.google.com:19302"},
        {urls:"stun:stun1.l.google.com:19302"},
        {urls:"stun:stun2.l.google.com:19302"}
      ]
    }
  });

  peer.on("open",id=>{
    myPeerId = id;
    document.getElementById("myIdLabel").innerText = id;

    socket.emit("join-room",{
      room,
      peerId:id,
      name:myName,
      deviceId:myDeviceId
    });
  });

  peer.on("call",call=>{
    call.answer(localStream);

    call.on("stream",remoteStream=>{
      createAudio(call.peer,remoteStream);
    });

    calls[call.peer] = call;
  });

  socket.on("users-in-room",existingUsers=>{
    existingUsers.forEach(user=>{
      addUser(user.peerId,user.name);

      if(!calls[user.peerId]){
        const call = peer.call(user.peerId,localStream);

        call.on("stream",remoteStream=>{
          createAudio(user.peerId,remoteStream);
        });

        calls[user.peerId] = call;
      }
    });
  });

  socket.on("user-joined",user=>{
    addUser(user.peerId,user.name);
  });

  socket.on("user-left",peerId=>{
    removeUser(peerId);
  });

  socket.on("user-talking",data=>{
    playSound("start");
    showSpeaker(data.name);
  });

  socket.on("user-stopped-talking",()=>{
    playSound("end");
    hideSpeaker();
  });
}

function createAudio(peerId,stream){
  let audio = document.getElementById("audio-"+peerId);

  if(!audio){
    audio = document.createElement("audio");
    audio.id = "audio-"+peerId;
    audio.autoplay = true;
    audio.playsInline = true;
    document.body.appendChild(audio);
  }

  audio.srcObject = stream;
  audio.volume = 1;
  audio.muted = false;
  audio.play().catch(()=>{});
}

function addUser(peerId,name){
  if(peerId === myPeerId) return;
  users[peerId] = {name};
  renderUsers();
}

function removeUser(peerId){
  delete users[peerId];

  if(calls[peerId]){
    calls[peerId].close();
    delete calls[peerId];
  }

  const audio = document.getElementById("audio-"+peerId);
  if(audio) audio.remove();

  renderUsers();
}

function renderUsers(){
  const box = document.getElementById("usersBox");
  box.innerHTML = "";

  const ids = Object.keys(users);

  if(ids.length === 0){
    box.innerHTML = "<div class='user'>Esperando usuarios...</div>";
    return;
  }

  ids.forEach(id=>{
    const div = document.createElement("div");
    div.className = "user";
    div.innerHTML = "<b>🟢 " + users[id].name + "</b>";
    box.appendChild(div);
  });
}

function startTalking(pointerId=null){
  if(isTalking) return;
  isTalking = true;

  playSound("start");

  localStream.getAudioTracks().forEach(t=>t.enabled=true);

  talkBtn.classList.add("transmitting");
  talkMain.innerText = "TRANSMITIENDO";
  talkSub.style.display = "none";

  showSpeaker(myName);

  socket.emit("talking-start",{
    room,
    name:myName
  });
}

function stopTalking(){
  if(!isTalking) return;
  isTalking = false;

  playSound("end");

  localStream.getAudioTracks().forEach(t=>t.enabled=false);

  talkBtn.classList.remove("transmitting");
  talkMain.innerText = "HABLAR";
  talkSub.style.display = "block";

  hideSpeaker();

  socket.emit("talking-stop",{
    room,
    name:myName
  });
}

talkBtn.addEventListener("pointerdown",e=>{
  e.preventDefault();

  try{
    talkBtn.setPointerCapture(e.pointerId);
  }catch{}

  startTalking(e.pointerId);
});

talkBtn.addEventListener("pointerup",e=>{
  e.preventDefault();

  try{
    talkBtn.releasePointerCapture(e.pointerId);
  }catch{}

  stopTalking();
});

talkBtn.addEventListener("pointercancel",e=>{
  e.preventDefault();
  stopTalking();
});

window.addEventListener("pointerup",()=>{
  stopTalking();
});

window.addEventListener("load",()=>{
  const savedName = localStorage.getItem("walkie_name");
  const savedRoom = localStorage.getItem("walkie_room");

  if(savedName) document.getElementById("nameInput").value = savedName;
  if(savedRoom) document.getElementById("roomInput").value = savedRoom;
});
</script>

</body>
</html>
