<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Walkie Pro</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:
radial-gradient(circle at center,#00334d 0%,#00131f 60%,#000814 100%);
min-height:100vh;
color:white;
padding:20px;
overflow-x:hidden;
}

.logo{
text-align:center;
font-size:70px;
font-weight:bold;
color:#ffe0b2;
text-shadow:
0 0 10px #ffcc80,
0 0 25px #ffb74d;
margin-top:20px;
margin-bottom:25px;
}

.login-box{
width:100%;
max-width:650px;
margin:auto;
background:rgba(0,0,0,0.35);
border:2px solid rgba(0,255,255,0.4);
border-radius:35px;
padding:25px;
backdrop-filter:blur(10px);
box-shadow:
0 0 30px rgba(0,255,255,0.15);
}

.input{
width:100%;
padding:25px;
border-radius:25px;
border:none;
outline:none;
font-size:26px;
margin-bottom:20px;
background:rgba(255,255,255,0.12);
color:white;
border:2px solid rgba(0,255,255,0.2);
}

.input::placeholder{
color:#d0d0d0;
}

.btn{
width:100%;
padding:25px;
border:none;
border-radius:25px;
font-size:32px;
font-weight:bold;
background:#2ed573;
color:white;
}

.panel{
display:none;
max-width:700px;
margin:auto;
}

.card{
background:rgba(0,0,0,0.35);
border:2px solid rgba(0,255,255,0.4);
border-radius:35px;
padding:22px;
margin-bottom:22px;
box-shadow:
0 0 20px rgba(0,255,255,0.12);
}

.row{
display:flex;
gap:18px;
align-items:center;
}

.icon{
width:90px;
height:90px;
border-radius:25px;
background:#10354d;
display:flex;
align-items:center;
justify-content:center;
font-size:42px;
}

.label{
color:#55d8ff;
font-size:22px;
font-weight:bold;
margin-bottom:8px;
}

.big{
font-size:34px;
font-weight:bold;
}

.device{
margin-top:12px;
background:rgba(255,255,255,0.12);
padding:18px;
border-radius:18px;
font-size:22px;
word-break:break-word;
}

.lines{
display:flex;
justify-content:space-between;
margin:20px 0;
padding:0 20px;
}

.line{
width:8px;
height:70px;
background:#1de9b6;
border-radius:20px;
box-shadow:
0 0 10px #1de9b6;
}

.talk-btn{
width:330px;
height:330px;
border-radius:50%;
margin:25px auto;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
font-size:70px;
font-weight:bold;
background:#07111f;
border:10px solid #ff9f43;
color:white;
box-shadow:
0 0 25px #ff9f43,
0 0 60px rgba(255,159,67,0.4);
}

.talk-btn small{
font-size:22px;
margin-top:10px;
font-weight:normal;
color:#ffe0b2;
}

.transmitiendo{
border-color:#00ff66 !important;
box-shadow:
0 0 25px #00ff66,
0 0 60px rgba(0,255,102,0.5);
color:#00ff66;
animation:pulse 1s infinite alternate;
}

@keyframes pulse{
from{
transform:scale(1);
}
to{
transform:scale(1.03);
}
}

.estado{
margin-top:10px;
padding:22px;
border-radius:30px;
font-size:60px;
font-weight:bold;
text-align:center;
color:#00ff66;
border:3px solid rgba(0,255,102,0.4);
box-shadow:
0 0 25px rgba(0,255,102,0.2);
}

.usuarios-box{
display:flex;
align-items:center;
justify-content:space-between;
gap:20px;
cursor:pointer;
}

.usuarios-info{
flex:1;
}

.preview{
margin-top:10px;
background:rgba(255,255,255,0.08);
padding:15px;
border-radius:18px;
font-size:20px;
}

.flecha{
font-size:60px;
}

.pantalla-usuarios{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:
radial-gradient(circle at center,#00334d 0%,#00131f 60%,#000814 100%);
z-index:9999;
display:none;
overflow-y:auto;
padding:20px;
}

.usuarios-header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:30px;
}

.usuarios-header h1{
font-size:65px;
color:#55d8ff;
}

.btn-volver{
background:#ff4d6d;
border:none;
padding:20px 35px;
border-radius:22px;
font-size:30px;
font-weight:bold;
color:white;
}

.usuario-card{
background:rgba(255,255,255,0.08);
border:2px solid rgba(85,216,255,0.25);
border-radius:30px;
padding:22px;
margin-bottom:20px;
}

.usuario-top{
display:flex;
align-items:center;
gap:18px;
margin-bottom:20px;
}

.usuario-avatar{
width:85px;
height:85px;
border-radius:25px;
background:#10354d;
display:flex;
align-items:center;
justify-content:center;
font-size:42px;
}

.usuario-nombre{
font-size:40px;
font-weight:bold;
}

.usuario-label{
color:#55d8ff;
font-size:22px;
margin-top:10px;
}

.usuario-dato{
background:rgba(255,255,255,0.08);
padding:18px;
border-radius:18px;
margin-top:10px;
font-size:22px;
word-break:break-word;
}

.estado-linea{
color:#00ff66;
font-size:28px;
font-weight:bold;
margin-top:18px;
}

.senal{
color:#ffd54a;
font-size:28px;
font-weight:bold;
margin-top:10px;
}

.hablando-card{
border:3px solid #00ff66 !important;
box-shadow:
0 0 25px rgba(0,255,102,0.5);
}

.toast{
position:fixed;
top:25px;
left:50%;
transform:translateX(-50%);
background:rgba(0,0,0,0.8);
padding:18px 28px;
border-radius:20px;
font-size:24px;
font-weight:bold;
display:none;
z-index:10000;
}

</style>
</head>

<body>
