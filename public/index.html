<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Walkie Grupal</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#061527;
  color:white;
  padding:15px;
}
.card{
  max-width:430px;
  margin:auto;
  background:#183b64;
  border-radius:25px;
  padding:20px;
  text-align:center;
}
input,button{
  width:100%;
  padding:16px;
  margin:8px 0;
  border:none;
  border-radius:16px;
  font-size:18px;
}
button{
  color:white;
  font-weight:bold;
  background:#2ecc71;
}
#talkBtn{
  width:240px;
  height:240px;
  border-radius:50%;
  background:#ef3340;
  font-size:38px;
  box-shadow:0 12px 0 #8d1520;
  margin:20px auto;
  display:block;
}
#talkBtn:active{
  transform:translateY(8px);
  box-shadow:0 3px 0 #8d1520;
}
#status{
  color:#ffd166;
  font-size:22px;
  margin:12px 0;
}
.user{
  background:#0d2746;
  padding:10px;
  border-radius:10px;
  margin:6px 0;
}
</style>
</head>

<body>

<div class="card">
  <h1>📻 Walkie Grupal</h1>

  <div id="login">
    <input id="nameInput" placeholder="Tu nombre">
    <input id="roomInput" placeholder="Nombre de sala" value="radio-mike">
    <button onclick="joinRoom()">ENTRAR A LA SALA</button>
  </div>

  <div id="app" style="display:none;">
    <p><b>Sala:</b> <span id="roomName"></span></p>
    <p><b>Tu ID:</b> <span id="myPeerId">...</span></p>

    <button id="talkBtn">HABLAR</button>

    <div id="status">Conectando...</div>

    <h3>Usuarios conectados</h3>
    <div id="users"></div>
  </div>
</div>

<audio id="remoteAudio" autoplay playsinline></audio>

<script src="/socket.io/socket.io.js"></script>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script>

<script>
let socket;
let peer;
let localStream = null;
let myPeerId = "";
let room = "";
let userName = "";

let peers = {};
let calls = {};

const login = document.getElementById("login");
const app = document.getElementById("app");
const statusDiv = document.getElementById("status");
const talkBtn = document.getElementById("talkBtn");
const usersDiv = document.getElementById("users");
const roomName = document.getElementById("roomName");
const myPeerIdSpan = document.getElementById("myPeerId");

function setStatus(text){
  statusDiv.innerText = text;
}

async function prepareMic(){
  if(localStream) return localStream;

  localStream = await navigator.mediaDevices.getUserMedia({
    audio:{
      echoCancellation:true,
      noiseSuppression:true,
      autoGainControl:true
    },
    video:false
  });

  localStream.getAudioTracks().forEach(track=>{
    track.enabled = false;
  });

  return localStream;
}

function getFixedId(){
  let id = localStorage.getItem("walkie_grupal_id");

  if(!id){
    id = "radio-" + Math.random().toString(36).substring(2,10);
    localStorage.setItem("walkie_grupal_id", id);
  }

  return id;
}

function addUser(peerId, name){
  if(document.getElementById("user-" + peerId)) return;

  const div = document.createElement("div");
  div.className = "user";
  div.id = "user-" + peerId;
  div.innerText = name + " conectado";
  usersDiv.appendChild(div);
}

function removeUser(peerId){
  const el = document.getElementById("user-" + peerId);
  if(el) el.remove();

  if(calls[peerId]){
    calls[peerId].close();
    delete calls[peerId];
  }
}

function playRemoteStream(remoteStream, peerId){
  let audio = document.getElementById("audio-" + peerId);

  if(!audio){
    audio = document.createElement("audio");
    audio.id = "audio-" + peerId;
    audio.autoplay = true;
    audio.playsInline = true;
    document.body.appendChild(audio);
  }

  audio.srcObject = remoteStream;
  audio.volume = 1;
  audio.muted = false;

  audio.play().catch(()=>{
    setStatus("Toca HABLAR para activar el audio.");
  });
}

async function joinRoom(){
  userName = document.getElementById("nameInput").value.trim();
  room = document.getElementById("roomInput").value.trim();

  if(!userName || !room){
    alert("Escribe tu nombre y sala");
    return;
  }

  try{
    await prepareMic();
  }catch{
    alert("Debes permitir el micrófono");
    return;
  }

  login.style.display = "none";
  app.style.display = "block";
  roomName.innerText = room;

  socket = io();

  myPeerId = getFixedId();

  peer = new Peer(myPeerId, {
  host: location.hostname,
  port: location.port || (location.protocol === "https:" ? 443 : 80),
  path: "/peerjs",
  secure: location.protocol === "https:",
  config: {
    iceServers: [
      { urls: "stun:stun.l.google.com:19302" },
      { urls: "stun:stun1.l.google.com:19302" }
    ]
  }
});

  socket.on("user-connected", data=>{
    addUser(data.peerId, data.name);

socket.on("existing-users", users => {
  users.forEach(user => {
    addUser(user.peerId, user.name);

    const call = peer.call(user.peerId, localStream);

    call.on("stream", remoteStream => {
      playRemoteStream(remoteStream, user.peerId);
    });

    calls[user.peerId] = call;
  });
});

function startTalking(){
  if(!localStream){
    setStatus("Micrófono no disponible.");
    return;
  }

  localStream.getAudioTracks().forEach(track=>{
    track.enabled = true;
  });

  setStatus("Transmitiendo para todos...");
}

function stopTalking(){
  if(!localStream) return;

  localStream.getAudioTracks().forEach(track=>{
    track.enabled = false;
  });

  setStatus("Conectado. Esperando transmisión.");
}

talkBtn.addEventListener("touchstart", e=>{
  e.preventDefault();
  startTalking();
});

talkBtn.addEventListener("touchend", e=>{
  e.preventDefault();
  stopTalking();
});

talkBtn.addEventListener("touchcancel", e=>{
  e.preventDefault();
  stopTalking();
});

talkBtn.addEventListener("mousedown", e=>{
  e.preventDefault();
  startTalking();
});

talkBtn.addEventListener("mouseup", e=>{
  e.preventDefault();
  stopTalking();
});

talkBtn.addEventListener("mouseleave", e=>{
  e.preventDefault();
  stopTalking();
});
</script>

</body>
</html>
