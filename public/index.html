<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Walkie Pro</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100dvh;overflow:hidden;font-family:Arial,sans-serif;background:#020812;color:white}
body{display:flex;justify-content:center;align-items:center;background:radial-gradient(circle at top,#063a55 0%,transparent 35%),radial-gradient(circle at bottom,#001f1e 0%,#020812 75%)}
.card{width:100vw;height:100dvh;max-width:430px;padding:calc(8px + env(safe-area-inset-top)) 18px calc(8px + env(safe-area-inset-bottom));overflow:hidden;display:flex;flex-direction:column;justify-content:space-evenly;background:radial-gradient(circle at 50% 45%,rgba(0,190,255,.11),transparent 32%),linear-gradient(180deg,rgba(2,25,38,.98),rgba(0,15,22,.98))}
h1{text-align:center;font-size:46px;line-height:1;font-family:Impact,Arial Black,sans-serif;color:#ffe0ad;text-shadow:0 0 16px rgba(255,185,90,.9),4px 4px 0 rgba(18,9,35,.95)}
.panel{border:1px solid rgba(0,220,255,.48);border-radius:18px;background:rgba(0,25,35,.72);box-shadow:inset 0 0 20px rgba(0,210,255,.08),0 0 12px rgba(0,200,255,.08);padding:12px;margin:5px 0}
.infoGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.infoItem,.fullItem{display:flex;align-items:center;gap:13px;text-align:left}
.iconBox{min-width:54px;width:54px;height:54px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:28px;background:rgba(0,180,255,.12);border:1px solid rgba(0,220,255,.22);box-shadow:inset 0 0 18px rgba(0,220,255,.08)}
.label{color:#42dcff;font-weight:bold;font-size:15px;margin-bottom:5px}
.value{color:#fff;font-weight:bold;font-size:21px}
.idValue{color:#e6fbff;font-size:16px;word-break:break-word;background:rgba(255,255,255,.09);border:1px solid rgba(0,220,255,.22);border-radius:12px;padding:8px 10px;margin-top:5px}
input,button{width:100%;border:none;border-radius:14px;padding:14px;font-size:18px;margin-top:8px}
input{background:rgba(255,255,255,.12);color:white;text-align:center;border:1px solid rgba(0,220,255,.3);user-select:text;-webkit-user-select:text}
button{background:#2ecc71;color:white;font-weight:bold}
.wave{height:40px;opacity:.85;background:repeating-linear-gradient(90deg,transparent 0 14px,rgba(0,255,220,.8) 14px 18px,transparent 18px 28px);filter:drop-shadow(0 0 8px rgba(0,255,220,.35))}
#talkBtn{width:180px;height:180px;margin:4px auto;border-radius:50%;border:4px solid #ff9a37;color:white;background:radial-gradient(circle at center,#172431 0%,#081018 58%,#02060a 100%);display:flex;flex-direction:column;justify-content:center;align-items:center;box-shadow:0 0 20px rgba(255,140,40,.95),0 0 48px rgba(255,115,20,.45),inset 0 0 35px rgba(255,255,255,.07);touch-action:none;position:relative}
#talkBtn *{pointer-events:none;user-select:none!important;-webkit-user-select:none!important;-webkit-touch-callout:none!important}
.transmitting{border:4px solid #00ff88!important;box-shadow:0 0 20px #00ff88,0 0 45px rgba(0,255,136,.75),inset 0 0 25px rgba(0,255,136,.3)!important}
.transmitting #talkMain{color:#00ff88!important;text-shadow:0 0 14px rgba(0,255,136,.95)}
#talkMain{font-size:32px;font-weight:bold;color:white}
#talkSub{font-size:14px;margin-top:7px;color:#ffd18a}
.statusPanel{border-color:rgba(0,255,100,.55)}
#status{font-size:34px;color:#00ff66;font-weight:bold;text-shadow:0 0 10px rgba(0,255,102,.85),0 0 22px rgba(0,255,102,.45)}
.userRow{display:flex;align-items:center;justify-content:space-between;cursor:pointer}
.user{background:rgba(255,255,255,.08);border:1px solid rgba(0,220,255,.22);border-radius:12px;padding:8px;margin-top:6px;color:white;text-align:left}
.user.speakingUser{border-color:#00ff88;box-shadow:0 0 18px rgba(0,255,136,.8);color:#00ff88}
#usersBox{max-height:80px;overflow:hidden}
#floatingSpeaker{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.88);color:#00ff88;padding:12px 22px;border-radius:999px;font-weight:bold;z-index:9999;display:none;box-shadow:0 0 24px rgba(0,255,136,.75)}
#radioBox{display:flex;flex-direction:column;justify-content:space-evenly;height:100%}
@media(max-height:760px){h1{font-size:40px}.panel{padding:9px;margin:4px 0}.iconBox{width:46px;height:46px;min-width:46px;font-size:24px}.value{font-size:18px}.idValue{font-size:14px}.wave{height:28px}#talkBtn{width:150px;height:150px}#talkMain{font-size:28px}#talkSub{font-size:12px}#status{font-size:28px}}
.actionGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.actionBtn{
  width:100%;
  padding:13px;
  border-radius:16px;
  background:rgba(0,180,255,.16);
  border:1px solid rgba(0,220,255,.28);
  color:white;
  font-weight:bold;
  font-size:15px;
}

#notifyBtn.active{
  background:rgba(0,255,136,.18);
  border-color:rgba(0,255,136,.55);
  color:#00ff88;
}

</style>
</head>
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Walkie Pro</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100dvh;overflow:hidden;font-family:Arial,sans-serif;background:#020812;color:white}
body{display:flex;justify-content:center;align-items:center;background:radial-gradient(circle at top,#063a55 0%,transparent 35%),radial-gradient(circle at bottom,#001f1e 0%,#020812 75%)}
.card{
  width:100vw;
  height:100dvh;
  max-width:430px;
  padding:calc(4px + env(safe-area-inset-top)) 16px calc(4px + env(safe-area-inset-bottom));
  overflow:hidden;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}

h1{
  font-size:38px;
}

.panel{
  padding:8px;
  margin:3px 0;
}

.iconBox{
  width:44px;
  height:44px;
  min-width:44px;
  font-size:23px;
}

.label{
  font-size:13px;
}

.value{
  font-size:17px;
}

.idValue{
  font-size:13px;
  padding:6px 8px;
}

.actionBtn{
  padding:9px;
  font-size:13px;
  margin-top:0;
}

.wave{
  height:24px;
}

#talkBtn{
  width:138px;
  height:138px;
  margin:2px auto;
}

#talkMain{
  font-size:25px;
}

#talkSub{
  font-size:11px;
}

#status{
  font-size:25px;
}

#usersBox{
  max-height:48px;
}

.user{
  padding:6px;
  font-size:13px;
}
#floatingSpeaker{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.88);color:#00ff88;padding:12px 22px;border-radius:999px;font-weight:bold;z-index:9999;display:none;box-shadow:0 0 24px rgba(0,255,136,.75)}
#radioBox{display:flex;flex-direction:column;justify-content:space-evenly;height:100%}
@media(max-height:760px){h1{font-size:40px}.panel{padding:9px;margin:4px 0}.iconBox{width:46px;height:46px;min-width:46px;font-size:24px}.value{font-size:18px}.idValue{font-size:14px}.wave{height:28px}#talkBtn{width:150px;height:150px}#talkMain{font-size:28px}#talkSub{font-size:12px}#status{font-size:28px}}
</style>
</head> 
<body>

<div id="floatingSpeaker"></div>

<div class="card">
  <h1>📻 Walkie Pro</h1>

  <div id="loginBox">
    <div class="panel">
      <input id="nameInput" placeholder="Tu nombre">
      <input id="roomInput" placeholder="Sala" value="radio-mike">
      <button id="joinBtn">ENTRAR</button>
    </div>
  </div>

  <div id="radioBox" style="display:none;">
    <div class="panel infoGrid">

      <div class="infoItem">
        <div class="iconBox">🏢</div>
        <div>
          <div class="label">Sala:</div>
          <div class="value" id="roomLabel"></div>
        </div>
      </div>

      <div class="infoItem">
        <div class="iconBox">👤</div>
        <div>
          <div class="label">Usuario:</div>
          <div class="value" id="nameLabel"></div>
        </div>
      </div>

    </div>

    <div class="panel fullItem">
      <div class="iconBox">📱</div>
      <div style="width:100%;">
        <div class="label">ID dispositivo:</div>
        <div class="idValue" id="deviceIdLabel"></div>
      </div>
    </div>

    <div class="panel fullItem">
      <div class="iconBox">📡</div>
      <div>
        <div class="label" style="color:#ffc247;">ID Radio:</div>
        <div class="value" id="myIdLabel"></div>
      </div>
    </div>
    <div class="panel">
  <div class="actionGrid">
    <button class="actionBtn" id="inviteBtn">📩 INVITAR</button>
    <button class="actionBtn" id="notifyBtn">🔔 NOTIFICAR</button>
  </div>
</div>

    <div class="wave"></div>

    <div id="talkBtn">
      <span id="talkMain">HABLAR</span>
      <span id="talkSub">Esperando transmisión</span>
    </div>

    <div class="panel statusPanel">
      <div id="status">🟢 CONECTADO</div>
    </div>

    <div class="panel userRow">
      <div class="infoItem">
        <div class="iconBox">👥</div>

        <div>
          <h3>Usuarios conectados</h3>
          <div id="usersCountText">0 conectados</div>
          <div id="usersBox"></div>
        </div>
      </div>

      <div style="font-size:34px;">›</div>
    </div>

  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";

import {
  getDatabase,
  ref,
  set,
  remove,
  onValue,
  onChildAdded,
  onChildRemoved,
  push,
  onDisconnect,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDOZBVsRy8vzDl8YSrYkoOdT2kQvCP1DLw",
  authDomain: "walkie-pro-1945a.firebaseapp.com",
  databaseURL: "https://walkie-pro-1945a-default-rtdb.firebaseio.com/",
  projectId: "walkie-pro-1945a",
  storageBucket: "walkie-pro-1945a.firebasestorage.app",
  messagingSenderId: "394474795757",
  appId: "1:394474795757:web:275208911e6cb14757d2e4"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const motorolaStart = new Audio("motorola-start.mp3");
const motorolaEnd = new Audio("motorola-end.mp3");

motorolaStart.preload = "auto";
motorolaEnd.preload = "auto";

motorolaStart.volume = 1;
motorolaEnd.volume = 1;

let joinedOnce = false;
let room = "";
let myName = "";
let myPeerId = "";
let myDeviceId = "";

let localStream = null;

let pcs = {};
let users = {};

let isTalking = false;
let lastSpeakerId = null;
let currentSpeakerId = null;

const joinBtn = document.getElementById("joinBtn");
const talkBtn = document.getElementById("talkBtn");

const talkMain = document.getElementById("talkMain");
const talkSub = document.getElementById("talkSub");

const usersCountText = document.getElementById("usersCountText");

function playSound(type){

  const sound =
    type === "start"
    ? motorolaStart
    : motorolaEnd;

  try{
    sound.pause();
    sound.currentTime = 0;
    sound.play().catch(()=>{});
  }catch{}
}

function getDeviceId(){

  let id =
    localStorage.getItem("walkie_device");

  if(!id){

    id =
      "device-" + crypto.randomUUID();

    localStorage.setItem(
      "walkie_device",
      id
    );
  }

  return id;
}

function getPeerId(){

  let id =
    localStorage.getItem("walkie_radio");

  if(!id){

    id =
      "radio-" +
      crypto.randomUUID()
      .replace(/-/g,"")
      .substring(0,14);

    localStorage.setItem(
      "walkie_radio",
      id
    );
  }

  return id;
}

function showSpeaker(name){

  const box =
    document.getElementById(
      "floatingSpeaker"
    );

  box.innerText =
    "🎙️ " + name + " está hablando";

  box.style.display = "block";
}

function hideSpeaker(){

  document.getElementById(
    "floatingSpeaker"
  ).style.display = "none";
}
function createAudio(peerId, stream){
  let audio = document.getElementById("audio-" + peerId);

  if(!audio){
    audio = document.createElement("audio");
    audio.id = "audio-" + peerId;
    audio.autoplay = true;
    audio.playsInline = true;
    document.body.appendChild(audio);
  }

  audio.srcObject = stream;
  audio.volume = 1;
  audio.muted = false;
  audio.play().catch(()=>{});
}

function renderUsers(){
  const box = document.getElementById("usersBox");
  box.innerHTML = "";

  const ids = Object.keys(users).filter(id => id !== myPeerId);
  usersCountText.innerText = ids.length + " conectados";

  if(ids.length === 0){
    box.innerHTML = "<div class='user'>Esperando usuarios...</div>";
    return;
  }

  ids.forEach(id=>{
    const div = document.createElement("div");
    const isSpeaking = currentSpeakerId === id;

    div.className = "user" + (isSpeaking ? " speakingUser" : "");

    div.innerHTML =
      "<b>" +
      (isSpeaking ? "🎙️ " : "🟢 ") +
      (users[id].name || "Usuario") +
      (isSpeaking ? " está hablando" : "") +
      "</b>";

    box.appendChild(div);
  });
}

function makePC(remoteId){
  if(pcs[remoteId]) return pcs[remoteId];

  const pc = new RTCPeerConnection({
    iceServers:[
      {urls:"stun:stun.l.google.com:19302"},
      {urls:"stun:stun1.l.google.com:19302"},
      {urls:"stun:stun2.l.google.com:19302"}
    ]
  });

  localStream.getTracks().forEach(track=>{
    pc.addTrack(track, localStream);
  });

  pc.ontrack = e=>{
    createAudio(remoteId, e.streams[0]);
  };

  pc.onicecandidate = e=>{
    if(e.candidate){
      push(
        ref(db, `rooms/${room}/signals/${remoteId}/${myPeerId}/candidates`),
        e.candidate.toJSON()
      );
    }
  };

  pcs[remoteId] = pc;
  listenSignals(remoteId, pc);
  return pc;
}

function listenSignals(remoteId, pc){
  onValue(ref(db, `rooms/${room}/signals/${myPeerId}/${remoteId}/offer`), async snap=>{
    const offer = snap.val();
    if(!offer) return;

    if(!pc.currentRemoteDescription){
      await pc.setRemoteDescription(new RTCSessionDescription(offer));

      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);

      await set(ref(db, `rooms/${room}/signals/${remoteId}/${myPeerId}/answer`), {
        type: answer.type,
        sdp: answer.sdp,
        time: Date.now()
      });
    }
  });

  onValue(ref(db, `rooms/${room}/signals/${myPeerId}/${remoteId}/answer`), async snap=>{
    const answer = snap.val();
    if(!answer) return;

    if(pc.signalingState !== "stable"){
      await pc.setRemoteDescription(new RTCSessionDescription(answer));
    }
  });

  onChildAdded(ref(db, `rooms/${room}/signals/${myPeerId}/${remoteId}/candidates`), async snap=>{
    const candidate = snap.val();

    if(candidate){
      try{
        await pc.addIceCandidate(new RTCIceCandidate(candidate));
      }catch{}
    }
  });
}

async function callPeer(remoteId){
  const pc = makePC(remoteId);

  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);

  await set(ref(db, `rooms/${room}/signals/${remoteId}/${myPeerId}/offer`), {
    type: offer.type,
    sdp: offer.sdp,
    time: Date.now()
  });
}

async function joinRoom(){
  myName = document.getElementById("nameInput").value.trim();
  room = document.getElementById("roomInput").value.trim();

  if(!myName || !room){
    alert("Completa los datos");
  setTimeout(()=>{
  joinedOnce = true;
},1500);
    return;
  }
  async function requestNotifications(){
  if(!("Notification" in window)){
    alert("Tu navegador no soporta notificaciones.");
    return;
  }

  const permission = await Notification.requestPermission();

  if(permission === "granted"){
    notificationsEnabled = true;
    notifyBtn.classList.add("active");
    alert("Notificaciones activadas");
  }else{
    alert("No se permitieron las notificaciones");
  }
}

async function shareRoom(){
  const url = `${location.origin}${location.pathname}?sala=${encodeURIComponent(room || document.getElementById("roomInput").value)}`;

  const text = `Únete a mi sala Walkie Pro 📻
Sala: ${room || document.getElementById("roomInput").value}

${url}`;

  if(navigator.share){
    await navigator.share({
      title:"Walkie Pro",
      text
    });
  }else{
    await navigator.clipboard.writeText(text);
    alert("Invitación copiada");
  }
}

  localStorage.setItem("walkie_name", myName);
  localStorage.setItem("walkie_room", room);

  myDeviceId = getDeviceId();
  myPeerId = getPeerId();

  try{
    motorolaStart.load();
    motorolaEnd.load();
  }catch{}

  try{
    localStream = await navigator.mediaDevices.getUserMedia({
      audio:true,
      video:false
    });
  }catch{
    alert("Permite el micrófono para usar el walkie.");
    return;
  }

  localStream.getAudioTracks().forEach(track=>{
    track.enabled = false;
  });

  document.getElementById("loginBox").style.display = "none";
  document.getElementById("radioBox").style.display = "flex";

  document.getElementById("roomLabel").innerText = room;
  document.getElementById("nameLabel").innerText = myName;
  document.getElementById("deviceIdLabel").innerText = myDeviceId;
  document.getElementById("myIdLabel").innerText = myPeerId;

  const myRef = ref(db, `rooms/${room}/peers/${myPeerId}`);

  await set(myRef, {
    id: myPeerId,
    name: myName,
    deviceId: myDeviceId,
    joinedAt: serverTimestamp()
  });

  onDisconnect(myRef).remove();
  onDisconnect(ref(db, `rooms/${room}/signals/${myPeerId}`)).remove();

  onChildAdded(ref(db, `rooms/${room}/peers`), async snap=>{
    const user = snap.val();
    const remoteId = snap.key;
    const alreadyExists = users[remoteId];
  
    users[remoteId] = user;
    renderUsers();

    if(remoteId !== myPeerId){
      makePC(remoteId);

      if(myPeerId > remoteId){
        setTimeout(()=>callPeer(remoteId), 500);
      }
    }
  });

  onChildRemoved(ref(db, `rooms/${room}/peers`), snap=>{
    const remoteId = snap.key;

    delete users[remoteId];
    renderUsers();

    if(pcs[remoteId]){
      pcs[remoteId].close();
      delete pcs[remoteId];
    }

    const audio = document.getElementById("audio-" + remoteId);
    if(audio) audio.remove();
  });

  onValue(ref(db, `rooms/${room}/speaking`), snap=>{
    const data = snap.val();

    if(data && data.id !== myPeerId){
      if(lastSpeakerId !== data.id){
        playSound("start");
      }

      lastSpeakerId = data.id;
      currentSpeakerId = data.id;

      showSpeaker(data.name || "Usuario");
      renderUsers();
    }

    if(!data){
      if(lastSpeakerId && lastSpeakerId !== myPeerId){
        playSound("end");
      }

      lastSpeakerId = null;
      currentSpeakerId = null;

      hideSpeaker();
      renderUsers();
    }
  });
}

function startTalking(){
  if(navigator.vibrate){
  navigator.vibrate(60);
}
  if(isTalking || !localStream) return;

  isTalking = true;
  currentSpeakerId = myPeerId;

  playSound("start");

  localStream.getAudioTracks().forEach(track=>{
    track.enabled = true;
  });

  talkBtn.classList.add("transmitting");
  talkMain.innerText = "TRANSMITIENDO";
  talkSub.style.display = "none";

  showSpeaker(myName);
  renderUsers();

  set(ref(db, `rooms/${room}/speaking`), {
    id: myPeerId,
    name: myName,
    time: Date.now()
  });
}

function stopTalking(){
  if(navigator.vibrate){
  navigator.vibrate(40);
}
  if(!isTalking || !localStream) return;

  isTalking = false;

  playSound("end");

  localStream.getAudioTracks().forEach(track=>{
    track.enabled = false;
  });

  talkBtn.classList.remove("transmitting");
  talkMain.innerText = "HABLAR";
  talkSub.style.display = "block";

  currentSpeakerId = null;

  hideSpeaker();
  renderUsers();

  remove(ref(db, `rooms/${room}/speaking`));
}

talkBtn.addEventListener("pointerdown",e=>{
  e.preventDefault();

  try{
    talkBtn.setPointerCapture(e.pointerId);
  }catch{}

  startTalking();
});

talkBtn.addEventListener("pointerup",e=>{
  e.preventDefault();

  try{
    talkBtn.releasePointerCapture(e.pointerId);
  }catch{}

  stopTalking();
});

talkBtn.addEventListener("pointercancel",e=>{
  e.preventDefault();
  stopTalking();
});

joinBtn.addEventListener("click",joinRoom);

window.addEventListener("load",()=>{
  const savedName = localStorage.getItem("walkie_name");
  const savedRoom = localStorage.getItem("walkie_room");

  if(savedName) document.getElementById("nameInput").value = savedName;
  if(savedRoom) document.getElementById("roomInput").value = savedRoom;
});

window.addEventListener("beforeunload",()=>{
  if(room && myPeerId){
    remove(ref(db, `rooms/${room}/peers/${myPeerId}`));
  }
});
const inviteBtn = document.getElementById("inviteBtn");
const notifyBtn = document.getElementById("notifyBtn");
let notificationsEnabled = false;

inviteBtn.addEventListener("click", shareRoom);
notifyBtn.addEventListener("click", requestNotifications);
  
</script>

</body>
</html>
