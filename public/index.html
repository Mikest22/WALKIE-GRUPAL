<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Walkie Pro</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  -webkit-touch-callout:none;
  user-select:none;
  -webkit-user-select:none;
}

html,body{
  width:100%;
  height:100dvh;
  overflow:hidden;
  font-family:Arial,sans-serif;
  background:#020812;
  color:white;
}

body{
  display:flex;
  justify-content:center;
  align-items:center;
  touch-action:manipulation;
  background:
    radial-gradient(circle at top,#063a55 0%,transparent 35%),
    radial-gradient(circle at bottom,#001f1e 0%,#020812 75%);
}

.card{
  width:100vw;
  height:100dvh;
  max-width:430px;
  padding:calc(8px + env(safe-area-inset-top)) 18px calc(8px + env(safe-area-inset-bottom));
  overflow:hidden;
  display:flex;
  flex-direction:column;
  justify-content:space-evenly;
  background:
    radial-gradient(circle at 50% 45%,rgba(0,190,255,.11),transparent 32%),
    linear-gradient(180deg,rgba(2,25,38,.98),rgba(0,15,22,.98));
}

h1{
  text-align:center;
  font-size:46px;
  line-height:1;
  font-family:Impact,Arial Black,sans-serif;
  color:#ffe0ad;
  text-shadow:0 0 16px rgba(255,185,90,.9),4px 4px 0 rgba(18,9,35,.95);
}

.panel{
  border:1px solid rgba(0,220,255,.48);
  border-radius:18px;
  background:rgba(0,25,35,.72);
  box-shadow:inset 0 0 20px rgba(0,210,255,.08),0 0 12px rgba(0,200,255,.08);
  padding:12px;
  margin:5px 0;
}

.infoGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.infoItem,.fullItem{
  display:flex;
  align-items:center;
  gap:13px;
  text-align:left;
}

.iconBox{
  min-width:54px;
  width:54px;
  height:54px;
  border-radius:16px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
  background:rgba(0,180,255,.12);
  border:1px solid rgba(0,220,255,.22);
  box-shadow:inset 0 0 18px rgba(0,220,255,.08);
}

.label{
  color:#42dcff;
  font-weight:bold;
  font-size:15px;
  margin-bottom:5px;
}

.value{
  color:#fff;
  font-weight:bold;
  font-size:21px;
}

.idValue{
  color:#e6fbff;
  font-size:16px;
  word-break:break-word;
  background:rgba(255,255,255,.09);
  border:1px solid rgba(0,220,255,.22);
  border-radius:12px;
  padding:8px 10px;
  margin-top:5px;
}

input,button{
  width:100%;
  border:none;
  border-radius:14px;
  padding:14px;
  font-size:18px;
  margin-top:8px;
}

input{
  background:rgba(255,255,255,.12);
  color:white;
  text-align:center;
  border:1px solid rgba(0,220,255,.3);
  user-select:text;
  -webkit-user-select:text;
}

button{
  background:#2ecc71;
  color:white;
  font-weight:bold;
}

.wave{
  height:40px;
  opacity:.85;
  background:repeating-linear-gradient(
    90deg,
    transparent 0 14px,
    rgba(0,255,220,.8) 14px 18px,
    transparent 18px 28px
  );
  filter:drop-shadow(0 0 8px rgba(0,255,220,.35));
}

#talkBtn{
  width:180px;
  height:180px;
  margin:4px auto;
  border-radius:50%;
  border:4px solid #ff9a37;
  color:white;
  background:radial-gradient(circle at center,#172431 0%,#081018 58%,#02060a 100%);
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  box-shadow:0 0 20px rgba(255,140,40,.95),0 0 48px rgba(255,115,20,.45),inset 0 0 35px rgba(255,255,255,.07);
  touch-action:none;
  position:relative;
  -webkit-touch-callout:none;
}

#talkBtn *{
  pointer-events:none;
  user-select:none !important;
  -webkit-user-select:none !important;
}

.transmitting{
  border:4px solid #00ff88 !important;
  box-shadow:0 0 20px #00ff88,0 0 45px rgba(0,255,136,.75),inset 0 0 25px rgba(0,255,136,.3) !important;
}

.transmitting #talkMain{
  color:#00ff88 !important;
  text-shadow:0 0 14px rgba(0,255,136,.95);
}

#talkMain{
  font-size:32px;
  font-weight:bold;
  color:white;
}

#talkSub{
  font-size:14px;
  margin-top:7px;
  color:#ffd18a;
}

.statusPanel{
  border-color:rgba(0,255,100,.55);
}

#status{
  font-size:34px;
  color:#00ff66;
  font-weight:bold;
  text-shadow:0 0 10px rgba(0,255,102,.85),0 0 22px rgba(0,255,102,.45);
}

.userRow{
  display:flex;
  align-items:center;
  justify-content:space-between;
  cursor:pointer;
}

.user{
  background:rgba(255,255,255,.08);
  border:1px solid rgba(0,220,255,.22);
  border-radius:12px;
  padding:8px;
  margin-top:6px;
  color:white;
  text-align:left;
}

.user.speakingUser{
  border-color:#00ff88;
  box-shadow:0 0 16px rgba(0,255,136,.7);
  color:#00ff88;
}

#usersBox{
  max-height:80px;
  overflow:hidden;
}

#floatingSpeaker{
  position:fixed;
  top:18px;
  left:50%;
  transform:translateX(-50%);
  background:rgba(0,0,0,.88);
  color:#00ff88;
  padding:12px 22px;
  border-radius:999px;
  font-weight:bold;
  z-index:9999;
  display:none;
  box-shadow:0 0 24px rgba(0,255,136,.75);
}

#radioBox{
  display:flex;
  flex-direction:column;
  justify-content:space-evenly;
  height:100%;
}

#usersScreen{
  display:none;
  position:fixed;
  inset:0;
  background:radial-gradient(circle at top,#063a55 0%,#020812 65%);
  z-index:99999;
  padding:calc(18px + env(safe-area-inset-top)) 18px calc(18px + env(safe-area-inset-bottom));
  overflow:auto;
}

.userCard{
  background:rgba(255,255,255,.08);
  border:1px solid rgba(0,220,255,.25);
  border-radius:18px;
  padding:16px;
  margin-bottom:14px;
  box-shadow:0 0 14px rgba(0,200,255,.12);
}

.userCard.speakingCard{
  border:2px solid #00ff88;
  box-shadow:0 0 22px rgba(0,255,136,.75);
}

.backBtn{
  width:auto;
  background:#ff4f5e;
  padding:11px 18px;
  border-radius:14px;
}

@media(max-height:760px){
  h1{font-size:40px}
  .panel{padding:9px;margin:4px 0}
  .iconBox{width:46px;height:46px;min-width:46px;font-size:24px}
  .value{font-size:18px}
  .idValue{font-size:14px}
  .wave{height:28px}
  #talkBtn{width:150px;height:150px}
  #talkMain{font-size:28px}
  #talkSub{font-size:12px}
  #status{font-size:28px}
}
</style>
</head>
