<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Walkie Pro</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
  -webkit-user-select:none;
}

html,body{
  width:100%;
  height:100dvh;
  overflow:hidden;
  font-family:Arial,sans-serif;
  color:white;
  background:#020812;
}

body{
  display:flex;
  justify-content:center;
  align-items:center;
  background:
    radial-gradient(circle at top,#06324a 0%,transparent 35%),
    radial-gradient(circle at bottom,#001f1e 0%,#020812 70%);
}

.card{
  width:100vw;
  height:100dvh;
  max-width:430px;
  padding:calc(12px + env(safe-area-inset-top)) 18px calc(12px + env(safe-area-inset-bottom));
  overflow:hidden;
  display:flex;
  flex-direction:column;
  justify-content:space-evenly;
  background:
    linear-gradient(180deg,rgba(2,25,38,.98),rgba(0,15,22,.98));
  position:relative;
}

.card::before{
  content:"";
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at 50% 42%,rgba(0,200,255,.13),transparent 32%),
    linear-gradient(90deg,rgba(0,255,255,.05),transparent,rgba(0,255,255,.05));
  pointer-events:none;
}

h1{
  position:relative;
  text-align:center;
  font-size:48px;
  line-height:1;
  font-family:Impact,Arial Black,sans-serif;
  color:#ffe1b5;
  text-shadow:
    0 0 14px rgba(255,180,80,.85),
    4px 4px 0 rgba(20,10,40,.9);
  margin-bottom:8px;
}

.panel{
  position:relative;
  border:1px solid rgba(0,220,255,.45);
  border-radius:18px;
  background:rgba(0,25,35,.68);
  box-shadow:
    inset 0 0 20px rgba(0,210,255,.08),
    0 0 12px rgba(0,200,255,.08);
  padding:13px 16px;
  margin:5px 0;
  color:white;
}

.panel:nth-of-type(1){
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  text-align:left;
}

.panel:nth-of-type(1) p{
  font-size:15px;
  color:#42dcff !important;
}

.panel:nth-of-type(1) b{
  display:block;
  color:#42dcff !important;
  margin-bottom:5px;
}

.panel *{
  color:white !important;
}

input,button{
  width:100%;
  border:none;
  border-radius:14px;
  padding:14px;
  font-size:18px;
  margin-top:8px;
}

input{
  background:rgba(255,255,255,.12);
  color:white;
  text-align:center;
  border:1px solid rgba(0,220,255,.3);
  user-select:text;
  -webkit-user-select:text;
}

button{
  background:#2ecc71;
  color:white;
  font-weight:bold;
}

.idText{
  background:rgba(255,255,255,.1);
  border:1px solid rgba(0,220,255,.25);
  border-radius:12px;
  padding:10px;
  font-size:14px;
  word-break:break-word;
  color:#e6fbff !important;
}

.wave{
  height:42px;
  margin:2px 0;
  opacity:.8;
  background:
    repeating-linear-gradient(
      90deg,
      transparent 0 14px,
      rgba(0,255,220,.75) 14px 18px,
      transparent 18px 28px
    );
  filter:drop-shadow(0 0 8px rgba(0,255,220,.35));
}

#talkBtn{
  width:190px;
  height:190px;
  margin:6px auto;
  border-radius:50%;
  border:4px solid #ff9a37;
  color:white;
  background:
    radial-gradient(circle at center,#172431 0%,#081018 58%,#02060a 100%);
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  box-shadow:
    0 0 20px rgba(255,140,40,.95),
    0 0 48px rgba(255,115,20,.45),
    inset 0 0 35px rgba(255,255,255,.07);
  touch-action:none;
  position:relative;
}

#talkBtn::before{
  content:"";
  position:absolute;
  inset:-18px;
  border-radius:50%;
  border:1px solid rgba(0,220,255,.13);
  box-shadow:0 0 35px rgba(0,200,255,.08);
}

.transmitting{
  border:4px solid #00ff88 !important;
  box-shadow:
    0 0 20px #00ff88,
    0 0 45px rgba(0,255,136,.75),
    inset 0 0 25px rgba(0,255,136,.3) !important;
}

.transmitting #talkMain{
  color:#00ff88 !important;
  text-shadow:0 0 14px rgba(0,255,136,.95);
}

#talkMain{
  font-size:32px;
  font-weight:bold;
  color:white;
  pointer-events:none;
}

#talkSub{
  font-size:14px;
  margin-top:8px;
  color:#ffd18a !important;
  pointer-events:none;
}

#status{
  font-size:34px;
  color:#ffd18a !important;
  font-weight:bold;
  text-shadow:0 0 12px rgba(255,200,100,.35);
}

#status::first-letter{
  color:#00ff55;
}

.user{
  background:rgba(255,255,255,.08);
  border:1px solid rgba(0,220,255,.2);
  border-radius:12px;
  padding:10px;
  margin-top:6px;
  color:white;
  text-align:left;
}

#usersBox{
  max-height:85px;
  overflow:hidden;
}

#floatingSpeaker{
  position:fixed;
  top:18px;
  left:50%;
  transform:translateX(-50%);
  background:rgba(0,0,0,.88);
  color:#00ff88;
  padding:12px 22px;
  border-radius:999px;
  font-weight:bold;
  z-index:9999;
  display:none;
  box-shadow:0 0 24px rgba(0,255,136,.75);
}

#loginBox{
  position:relative;
  z-index:2;
}

#radioBox{
  position:relative;
  z-index:2;
  display:flex;
  flex-direction:column;
  justify-content:space-evenly;
  height:100%;
}

#radioBox .panel:last-of-type{
  display:flex;
  align-items:center;
  justify-content:space-between;
  text-align:left;
}

#radioBox .panel:last-of-type h3{
  font-size:22px;
}

@media(max-height:750px){
  h1{font-size:42px;}
  #talkBtn{width:165px;height:165px;}
  #talkMain{font-size:28px;}
  .panel{padding:10px 13px;}
  .wave{height:30px;}
}
</style>
</head>

<body>

<div id="floatingSpeaker"></div>

<div class="card">

<h1>📻 Walkie Pro</h1>

<div id="loginBox">
  <div class="panel">
    <input id="nameInput" placeholder="Tu nombre">
    <input id="roomInput" placeholder="Sala" value="radio-mike">
    <button onclick="joinRoom()">ENTRAR</button>
  </div>
</div>

<div id="radioBox" style="display:none;">

  <div class="panel">
    <p><b>Sala:</b> <span id="roomLabel"></span></p>
    <br>
    <p><b>Usuario:</b> <span id="nameLabel"></span></p>
  </div>

  <div class="panel">
    <p><b>ID dispositivo:</b></p>
    <br>
    <div class="idText" id="deviceIdLabel"></div>
    <br>
    <p><b>ID Radio:</b> <span id="myIdLabel"></span></p>
  </div>

  <div class="wave"></div>

  <div id="talkBtn">
    <span id="talkMain">HABLAR</span>
    <span id="talkSub">Esperando transmisión</span>
  </div>

  <div class="panel">
    <div id="status">🟢 CONECTADO</div>
  </div>

  <div class="panel">
    <h3>Usuarios conectados</h3>
    <div id="usersBox"></div>
  </div>

</div>

</div>

<script src="/socket.io/socket.io.js"></script>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script>

<script>
const motorolaStart = new Audio("./assets/motorola-start.mp3");
const motorolaEnd = new Audio("./assets/motorola-end.mp3");

motorolaStart.preload = "auto";
motorolaEnd.preload = "auto";
motorolaStart.volume = 1;
motorolaEnd.volume = 1;

let socket;
let peer;
let localStream;
let room = "";
let myName = "";
let myPeerId = "";
let myDeviceId = "";
let users = {};
let calls = {};
let isTalking = false;

const talkBtn = document.getElementById("talkBtn");
const talkMain = document.getElementById("talkMain");
const talkSub = document.getElementById("talkSub");

talkBtn.addEventListener("selectstart", e => e.preventDefault());
talkBtn.addEventListener("contextmenu", e => e.preventDefault());

function instantBeep(type){
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();

  osc.type = "square";
  osc.frequency.value = type === "start" ? 1200 : 650;

  gain.gain.setValueAtTime(0.20, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);

  osc.connect(gain);
  gain.connect(ctx.destination);

  osc.start();
  osc.stop(ctx.currentTime + 0.08);
}

function playSound(type){
  const sound = type === "start" ? motorolaStart : motorolaEnd;

  instantBeep(type);

  try{
    sound.currentTime = 0;
    sound.play().catch(()=>{});
  }catch{}
}

function getDeviceId(){
  let id = localStorage.getItem("walkie_device");

  if(!id){
    id = "device-" + crypto.randomUUID();
    localStorage.setItem("walkie_device", id);
  }

  return id;
}

function getPeerId(){
  let id = localStorage.getItem("walkie_radio");

  if(!id){
    id = "radio-" + crypto.randomUUID().replace(/-/g,"").substring(0,14);
    localStorage.setItem("walkie_radio", id);
  }

  return id;
}

function showSpeaker(name){
  const box = document.getElementById("floatingSpeaker");
  box.innerText = "🎙️ " + name + " está hablando";
  box.style.display = "block";
}

function hideSpeaker(){
  document.getElementById("floatingSpeaker").style.display = "none";
}

async function joinRoom(){
  myName = document.getElementById("nameInput").value.trim();
  room = document.getElementById("roomInput").value.trim();

  if(!myName || !room){
    alert("Completa los datos");
    return;
  }

  localStorage.setItem("walkie_name", myName);
  localStorage.setItem("walkie_room", room);

  myDeviceId = getDeviceId();
  myPeerId = getPeerId();

  localStream = await navigator.mediaDevices.getUserMedia({
    audio:true,
    video:false
  });

  localStream.getAudioTracks().forEach(t=>t.enabled=false);

  try{
    motorolaStart.load();
    motorolaEnd.load();
  }catch{}

  document.getElementById("loginBox").style.display = "none";
  document.getElementById("radioBox").style.display = "block";

  document.getElementById("roomLabel").innerText = room;
  document.getElementById("nameLabel").innerText = myName;
  document.getElementById("deviceIdLabel").innerText = myDeviceId;
  document.getElementById("myIdLabel").innerText = myPeerId;

  socket = io();

  peer = new Peer(myPeerId,{
    host:location.hostname,
    port:location.port || (location.protocol === "https:" ? 443 : 80),
    path:"/peerjs",
    secure:location.protocol === "https:",
    config:{
      iceServers:[
        {urls:"stun:stun.l.google.com:19302"},
        {urls:"stun:stun1.l.google.com:19302"},
        {urls:"stun:stun2.l.google.com:19302"}
      ]
    }
  });

  peer.on("open",id=>{
    myPeerId = id;
    document.getElementById("myIdLabel").innerText = id;

    socket.emit("join-room",{
      room,
      peerId:id,
      name:myName,
      deviceId:myDeviceId
    });
  });

  peer.on("call",call=>{
    call.answer(localStream);

    call.on("stream",remoteStream=>{
      createAudio(call.peer,remoteStream);
    });

    calls[call.peer] = call;
  });

  socket.on("users-in-room",existingUsers=>{
    existingUsers.forEach(user=>{
      addUser(user.peerId,user.name);

      if(!calls[user.peerId]){
        const call = peer.call(user.peerId,localStream);

        call.on("stream",remoteStream=>{
          createAudio(user.peerId,remoteStream);
        });

        calls[user.peerId] = call;
      }
    });
  });

  socket.on("user-joined",user=>{
    addUser(user.peerId,user.name);
  });

  socket.on("user-left",peerId=>{
    removeUser(peerId);
  });

  socket.on("user-talking",data=>{
    playSound("start");
    showSpeaker(data.name);
  });

  socket.on("user-stopped-talking",()=>{
    playSound("end");
    hideSpeaker();
  });
}

function createAudio(peerId,stream){
  let audio = document.getElementById("audio-"+peerId);

  if(!audio){
    audio = document.createElement("audio");
    audio.id = "audio-"+peerId;
    audio.autoplay = true;
    audio.playsInline = true;
    document.body.appendChild(audio);
  }

  audio.srcObject = stream;
  audio.volume = 1;
  audio.muted = false;
  audio.play().catch(()=>{});
}

function addUser(peerId,name){
  if(peerId === myPeerId) return;
  users[peerId] = {name};
  renderUsers();
}

function removeUser(peerId){
  delete users[peerId];

  if(calls[peerId]){
    calls[peerId].close();
    delete calls[peerId];
  }

  const audio = document.getElementById("audio-"+peerId);
  if(audio) audio.remove();

  renderUsers();
}

function renderUsers(){
  const box = document.getElementById("usersBox");
  box.innerHTML = "";

  const ids = Object.keys(users);

  if(ids.length === 0){
    box.innerHTML = "<div class='user'>Esperando usuarios...</div>";
    return;
  }

  ids.forEach(id=>{
    const div = document.createElement("div");
    div.className = "user";
    div.innerHTML = "<b>🟢 " + users[id].name + "</b>";
    box.appendChild(div);
  });
}

function startTalking(){
  if(isTalking) return;
  isTalking = true;

  playSound("start");

  localStream.getAudioTracks().forEach(t=>t.enabled=true);

  talkBtn.classList.add("transmitting");
  talkMain.innerText = "TRANSMITIENDO";
  talkSub.style.display = "none";

  showSpeaker(myName);

  socket.emit("talking-start",{
    room,
    name:myName
  });
}

function stopTalking(){
  if(!isTalking) return;
  isTalking = false;

  playSound("end");

  localStream.getAudioTracks().forEach(t=>t.enabled=false);

  talkBtn.classList.remove("transmitting");
  talkMain.innerText = "HABLAR";
  talkSub.style.display = "block";

  hideSpeaker();

  socket.emit("talking-stop",{
    room,
    name:myName
  });
}

talkBtn.addEventListener("pointerdown",e=>{
  e.preventDefault();
  startTalking();
});

talkBtn.addEventListener("pointerup",e=>{
  e.preventDefault();
  stopTalking();
});

talkBtn.addEventListener("pointercancel",e=>{
  e.preventDefault();
  stopTalking();
});

talkBtn.addEventListener("pointerleave",e=>{
  e.preventDefault();
  stopTalking();
});

window.addEventListener("load",()=>{
  const savedName = localStorage.getItem("walkie_name");
  const savedRoom = localStorage.getItem("walkie_room");

  if(savedName) document.getElementById("nameInput").value = savedName;
  if(savedRoom) document.getElementById("roomInput").value = savedRoom;
});
</script>

</body>
</html>
