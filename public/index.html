<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Walkie Grupal Pro</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  background:#061527;
  color:white;
  font-family:Arial,sans-serif;
}

body{
  display:flex;
  justify-content:center;
  align-items:center;
  padding:15px;
}

.card{
  width:100%;
  max-width:430px;
  background:#183b64;
  border-radius:26px;
  padding:20px;
  text-align:center;
}

h1{
  font-size:34px;
  margin:10px 0 20px;
}

input,button{
  width:100%;
  padding:16px;
  margin:8px 0;
  border:none;
  border-radius:16px;
  font-size:18px;
}

button{
  color:white;
  font-weight:bold;
  background:#2ecc71;
}

#talkBtn{
  width:250px;
  height:250px;
  border-radius:50%;
  background:#ef3340;
  font-size:42px;
  box-shadow:0 12px 0 #8d1520;
  margin:25px auto;
  display:block;
}

#talkBtn:active{
  transform:translateY(8px);
  box-shadow:0 3px 0 #8d1520;
}

#status{
  color:#ffd166;
  font-size:24px;
  margin:15px 0;
}

.user{
  background:#0d2746;
  padding:10px;
  border-radius:12px;
  margin:8px 0;
}

.small{
  color:#dfe6e9;
  font-size:15px;
  word-break:break-word;
}

.idbox{
  background:#0d2746;
  padding:10px;
  border-radius:12px;
  margin:10px 0;
}
</style>
</head>

<body>

<div class="card">

  <h1>📻 Walkie Pro</h1>

  <div id="loginBox">
    <input id="nameInput" placeholder="Tu nombre">
    <input id="roomInput" value="radio-mike" placeholder="Sala">
    <button onclick="joinRoom()">ENTRAR</button>
  </div>

  <div id="radioBox" style="display:none;">

    <p><b>Sala:</b> <span id="roomLabel"></span></p>

    <p><b>Usuario:</b> <span id="nameLabel"></span></p>

    <div class="idbox">
      <p class="small"><b>ID del dispositivo:</b></p>
      <p class="small" id="deviceIdLabel">...</p>
    </div>

    <p><b>ID Radio:</b> <span id="myIdLabel">...</span></p>

    <button id="talkBtn">HABLAR</button>

    <div id="status">Conectando...</div>

    <h3>Usuarios conectados</h3>

    <div id="usersBox"></div>

  </div>

</div>

<script src="/socket.io/socket.io.js"></script>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script>

<script>

let socket;
let peer;
let localStream;
let room="";
let myName="";
let myPeerId="";
let myDeviceId="";
let calls={};
let users={};

const loginBox=document.getElementById("loginBox");
const radioBox=document.getElementById("radioBox");

const nameInput=document.getElementById("nameInput");
const roomInput=document.getElementById("roomInput");

const roomLabel=document.getElementById("roomLabel");
const nameLabel=document.getElementById("nameLabel");

const myIdLabel=document.getElementById("myIdLabel");
const deviceIdLabel=document.getElementById("deviceIdLabel");

const statusBox=document.getElementById("status");
const usersBox=document.getElementById("usersBox");

const talkBtn=document.getElementById("talkBtn");

function setStatus(text){
  statusBox.innerText=text;
}

function radioBeep(type){

  const audioCtx =
  new (window.AudioContext || window.webkitAudioContext)();

  const osc = audioCtx.createOscillator();

  const gain = audioCtx.createGain();

  osc.connect(gain);

  gain.connect(audioCtx.destination);

  osc.type = "square";

  if(type==="start"){
    osc.frequency.value = 950;
  }else{
    osc.frequency.value = 520;
  }

  gain.gain.setValueAtTime(
    0.15,
    audioCtx.currentTime
  );

  gain.gain.exponentialRampToValueAtTime(
    0.001,
    audioCtx.currentTime + 0.15
  );

  osc.start();

  osc.stop(audioCtx.currentTime + 0.15);

}

function getFixedDeviceId(){

  let id =
  localStorage.getItem(
    "walkie_device_id"
  );

  if(!id){

    id =
    "device-" +
    crypto.randomUUID();

    localStorage.setItem(
      "walkie_device_id",
      id
    );

  }

  return id;

}

function getFixedPeerId(){

  let id =
  localStorage.getItem(
    "walkie_peer_id"
  );

  if(!id){

    id =
    "radio-" +
    getFixedDeviceId()
    .replace("device-","")
    .replace(/-/g,"")
    .substring(0,14);

    localStorage.setItem(
      "walkie_peer_id",
      id
    );

  }

  return id;

}

function loadSavedData(){

  const savedName =
  localStorage.getItem(
    "walkie_name"
  );

  const savedRoom =
  localStorage.getItem(
    "walkie_room"
  );

  if(savedName){
    nameInput.value = savedName;
  }

  if(savedRoom){
    roomInput.value = savedRoom;
  }

}

function saveUserData(){

  localStorage.setItem(
    "walkie_name",
    myName
  );

  localStorage.setItem(
    "walkie_room",
    room
  );

}

async function prepareMic(){

  localStream =
  await navigator.mediaDevices
  .getUserMedia({

    audio:{
      echoCancellation:true,
      noiseSuppression:true,
      autoGainControl:true
    },

    video:false

  });

  localStream
  .getAudioTracks()
  .forEach(track=>{

    track.enabled=false;

  });

}

function createAudio(peerId,stream){

  let audio =
  document.getElementById(
    "audio-"+peerId
  );

  if(!audio){

    audio =
    document.createElement(
      "audio"
    );

    audio.id =
    "audio-"+peerId;

    audio.autoplay=true;

    audio.playsInline=true;

    document.body.appendChild(
      audio
    );

  }

  audio.srcObject = stream;

  audio.volume = 1;

  audio.play();

}

function addUser(peerId,name,deviceId){

  if(peerId===myPeerId)
  return;

  users[peerId]={
    name,
    deviceId
  };

  renderUsers();

}

function removeUser(peerId){

  delete users[peerId];

  if(calls[peerId]){

    calls[peerId].close();

    delete calls[peerId];

  }

  renderUsers();

}

function renderUsers(){

  usersBox.innerHTML="";

  const ids =
  Object.keys(users);

  if(ids.length===0){

    usersBox.innerHTML=
    "<p class='small'>Sin usuarios.</p>";

    return;

  }

  ids.forEach(id=>{

    const div =
    document.createElement(
      "div"
    );

    div.className="user";

    div.innerHTML=`
      <b>${users[id].name}</b><br>
      <span class='small'>
      ${users[id].deviceId}
      </span>
    `;

    usersBox.appendChild(
      div
    );

  });

}

function callUser(peerId){

  if(calls[peerId])
  return;

  const call =
  peer.call(
    peerId,
    localStream
  );

  call.on(
    "stream",
    remoteStream=>{

      createAudio(
        peerId,
        remoteStream
      );

    }
  );

  calls[peerId]=call;

}

async function joinRoom(){

  myName =
  nameInput.value.trim();

  room =
  roomInput.value.trim();

  if(!myName || !room){

    alert(
      "Completa los datos"
    );

    return;

  }

  saveUserData();

  await prepareMic();

  loginBox.style.display=
  "none";

  radioBox.style.display=
  "block";

  myDeviceId =
  getFixedDeviceId();

  roomLabel.innerText=
  room;

  nameLabel.innerText=
  myName;

  deviceIdLabel.innerText=
  myDeviceId;

  socket = io();

  myPeerId =
  getFixedPeerId();

  peer =
  new Peer(
    myPeerId,
    {

      host:
      location.hostname,

      port:
      location.port ||
      (
        location.protocol==="https:"
        ?443
        :80
      ),

      path:"/peerjs",

      secure:
      location.protocol==="https:",

      config:{
        iceServers:[
          {
            urls:
            "stun:stun.l.google.com:19302"
          }
        ]
      }

    }
  );

  peer.on(
    "open",
    id=>{

      myIdLabel.innerText=id;

      socket.emit(
        "join-room",
        {
          room,
          peerId:id,
          name:myName,
          deviceId:myDeviceId
        }
      );

      setStatus(
        "Conectado"
      );

    }
  );

  peer.on(
    "call",
    call=>{

      call.answer(
        localStream
      );

      call.on(
        "stream",
        remoteStream=>{

          createAudio(
            call.peer,
            remoteStream
          );

        }
      );

      calls[
        call.peer
      ] = call;

    }
  );

  socket.on(
    "users-in-room",
    existingUsers=>{

      existingUsers
      .forEach(
        user=>{

          addUser(
            user.peerId,
            user.name,
            user.deviceId
          );

          callUser(
            user.peerId
          );

        }
      );

    }
  );

  socket.on(
    "user-joined",
    user=>{

      addUser(
        user.peerId,
        user.name,
        user.deviceId
      );

    }
  );

  socket.on(
    "user-left",
    peerId=>{

      removeUser(
        peerId
      );

    }
  );

}

function startTalking(){

  if(!localStream)
  return;

  radioBeep(
    "start"
  );

  localStream
  .getAudioTracks()
  .forEach(
    track=>{

      track.enabled=true;

    }
  );

  setStatus(
    "Transmitiendo..."
  );

}

function stopTalking(){

  if(!localStream)
  return;

  radioBeep(
    "stop"
  );

  localStream
  .getAudioTracks()
  .forEach(
    track=>{

      track.enabled=false;

    }
  );

  setStatus(
    "Conectado"
  );

}

talkBtn.addEventListener(
  "touchstart",
  e=>{

    e.preventDefault();

    startTalking();

  }
);

talkBtn.addEventListener(
  "touchend",
  e=>{

    e.preventDefault();

    stopTalking();

  }
);

talkBtn.addEventListener(
  "mousedown",
  e=>{

    e.preventDefault();

    startTalking();

  }
);

talkBtn.addEventListener(
  "mouseup",
  e=>{

    e.preventDefault();

    stopTalking();

  }
);

loadSavedData();

</script>

</body>
</html>
